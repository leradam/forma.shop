{% extends 'app/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{% url 'app:register' %}">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
