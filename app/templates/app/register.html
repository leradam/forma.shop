{% extends 'app/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'app:login' %}">Войдите</a></p>
</div>
{% endblock %}
