{% extends 'app/base.html' %}
{% block title %}{% if form.instance.pk %}Редактирование отзыва{% else %}Новый отзыв{% endif %}{% endblock %}
{% block content %}
<div class="form-container">
    <h1>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} отзыв</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'app:review_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
